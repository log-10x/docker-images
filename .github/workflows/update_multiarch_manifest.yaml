name: Updates manifest for multi arch release

on:
  workflow_call:
    inputs:
      version_tag:
        required: true
        type: string
      docker_hub:
        required: true
        type: string
      docker_repo:
        required: true
        type: string
      image_name:
        required: true
        type: string
      dockerhub_repo:
        required: true
        type: string

jobs:
  publish_manifest:
    name: Publish proper manifest
    runs-on: ubuntu-latest

    # id-token: write is what makes keyless signing possible. Cosign exchanges
    # this workflow's OIDC token for a short-lived Fulcio certificate, so the
    # signature is bound to the workflow identity that produced the image and
    # there is no private key to store, rotate, or lose. packages: write is
    # needed because cosign pushes the signature to the registry as its own tag
    # alongside the image.
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Login to GHCR
        if: ${{ inputs.docker_hub == 'GHCR' || inputs.docker_hub == 'All' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ inputs.docker_hub == 'DockerHub' || inputs.docker_hub == 'All' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Create GHCR manifest for ${{inputs.version_tag}}
        if: ${{ inputs.docker_hub == 'GHCR' || inputs.docker_hub == 'All' }}
        run: |
          docker manifest create ${{inputs.docker_repo}}/${{inputs.image_name}}:${{inputs.version_tag}} \
            --amend ${{inputs.docker_repo}}/${{inputs.image_name}}:${{inputs.version_tag}}-amd64 \
            --amend ${{inputs.docker_repo}}/${{inputs.image_name}}:${{inputs.version_tag}}-aarch64

          docker manifest annotate --arch amd64 --os linux ${{inputs.docker_repo}}/${{inputs.image_name}}:${{inputs.version_tag}} ${{inputs.docker_repo}}/${{inputs.image_name}}:${{inputs.version_tag}}-amd64
          docker manifest annotate --arch arm64 --os linux ${{inputs.docker_repo}}/${{inputs.image_name}}:${{inputs.version_tag}} ${{inputs.docker_repo}}/${{inputs.image_name}}:${{inputs.version_tag}}-aarch64
          docker manifest inspect ${{inputs.docker_repo}}/${{inputs.image_name}}:${{inputs.version_tag}}

          docker manifest push ${{inputs.docker_repo}}/${{inputs.image_name}}:${{inputs.version_tag}}

      # Sign the multi-arch index by DIGEST, not by tag. A tag is mutable and can
      # be repointed after signing; the digest is the content. Signing the index
      # covers both per-arch images beneath it, so one signature per image per
      # registry rather than one per architecture.
      - name: Sign GHCR image
        if: ${{ inputs.docker_hub == 'GHCR' || inputs.docker_hub == 'All' }}
        run: |
          IMAGE="${{inputs.docker_repo}}/${{inputs.image_name}}"
          # The FIRST "Digest:" line of imagetools output is the index digest.
          # Not `docker manifest inspect -v`: on a multi-arch tag that returns an
          # array of per-ARCHITECTURE manifests, so taking .[0] signs one arch and
          # silently leaves the index and the other arch unsigned.
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:${{inputs.version_tag}}" \
            | awk '/^Digest:/{print $2; exit}')
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "::error::could not resolve a digest for $IMAGE:${{inputs.version_tag}}; refusing to sign a tag"
            exit 1
          fi
          echo "signing $IMAGE@$DIGEST"
          cosign sign --yes "$IMAGE@$DIGEST"

      - name: Create Docker Hub manifest for ${{inputs.version_tag}}
        if: ${{ inputs.docker_hub == 'DockerHub' || inputs.docker_hub == 'All' }}
        run: |
          docker manifest create ${{inputs.dockerhub_repo}}/${{inputs.image_name}}:${{inputs.version_tag}} \
            --amend ${{inputs.dockerhub_repo}}/${{inputs.image_name}}:${{inputs.version_tag}}-amd64 \
            --amend ${{inputs.dockerhub_repo}}/${{inputs.image_name}}:${{inputs.version_tag}}-aarch64

          docker manifest annotate --arch amd64 --os linux ${{inputs.dockerhub_repo}}/${{inputs.image_name}}:${{inputs.version_tag}} ${{inputs.dockerhub_repo}}/${{inputs.image_name}}:${{inputs.version_tag}}-amd64
          docker manifest annotate --arch arm64 --os linux ${{inputs.dockerhub_repo}}/${{inputs.image_name}}:${{inputs.version_tag}} ${{inputs.dockerhub_repo}}/${{inputs.image_name}}:${{inputs.version_tag}}-aarch64
          docker manifest inspect ${{inputs.dockerhub_repo}}/${{inputs.image_name}}:${{inputs.version_tag}}

          docker manifest push ${{inputs.dockerhub_repo}}/${{inputs.image_name}}:${{inputs.version_tag}}

      - name: Sign Docker Hub image
        if: ${{ inputs.docker_hub == 'DockerHub' || inputs.docker_hub == 'All' }}
        run: |
          IMAGE="${{inputs.dockerhub_repo}}/${{inputs.image_name}}"
          # The FIRST "Digest:" line of imagetools output is the index digest.
          # Not `docker manifest inspect -v`: on a multi-arch tag that returns an
          # array of per-ARCHITECTURE manifests, so taking .[0] signs one arch and
          # silently leaves the index and the other arch unsigned.
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:${{inputs.version_tag}}" \
            | awk '/^Digest:/{print $2; exit}')
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "::error::could not resolve a digest for $IMAGE:${{inputs.version_tag}}; refusing to sign a tag"
            exit 1
          fi
          echo "signing $IMAGE@$DIGEST"
          cosign sign --yes "$IMAGE@$DIGEST"
