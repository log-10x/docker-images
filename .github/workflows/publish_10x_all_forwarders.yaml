name: Publish All 10x forwarders

# NOTE: the JIT builds are GONE. They installed the jpackage 'edge' flavor,
# which is retired (see pipeline-releases/FLAVORS.md), and they produced the
# -jit / -jit-debug tag suffixes. Tags already published keep working; no new
# ones are cut. Every forwarder now builds the runtime flavor only.
#
# NOTE: the Fluent Bit and Fluentd toggles below are RETIRED (image-swap model).
# Fluentd/Fluent Bit now run 10x as a separate log10x/edge-10x SIDECAR container on
# the upstream fluent charts, not a baked image. Kept for legacy rebuilds only --
# do not use for new work. Filebeat stays live (the one genuinely embedded forwarder).
# See https://doc.log10x.com/apps/receiver/deploy/

on:
  workflow_dispatch:
    inputs:
      release_version:
        required: false
        description: '10x version to install (leave empty for latest)'
        type: string
        default: ''
      docker_hub:
        required: true
        description: 'Which docker hub to publish to'
        type: choice
        options:
          - All
          - GHCR
          - DockerHub
      publish_filebeat:
        required: true
        type: boolean
        description: Filebeat
        default: true
      publish_filebeat_debug:
        required: true
        type: boolean
        description: Filebeat (Debug)
        default: true
      publish_fluent_bit:
        required: true
        type: boolean
        description: Fluent Bit
        default: true
      publish_fluent_bit_debug:
        required: true
        type: boolean
        description: Fluent Bit (Debug)
        default: true
      publish_fluentd:
        required: true
        type: boolean
        description: Fluentd
        default: true

jobs:
  prepare:
    name: Checks parameters and sets vars
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.resolve.outputs.release_version }}
    steps:
      - name: Check parameters
        uses: actions/github-script@v8
        with:
          script: |
            const validHubs = ["GHCR", "DockerHub", "All"];
            if (!validHubs.includes("${{ inputs.docker_hub }}")) {
              core.setFailed("docker_hub must be one of: GHCR, DockerHub, All")
            }

      - name: Resolve release version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.release_version }}" ]; then
            echo "Using provided version: ${{ inputs.release_version }}"
            echo "release_version=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "No version provided, fetching latest release..."
            LATEST=$(gh release view --repo https://github.com/${{ vars.RELEASE_REPO }} --json tagName -q '.tagName')
            echo "Latest release: $LATEST"
            echo "release_version=$LATEST" >> "$GITHUB_OUTPUT"
          fi

  # The ONLY job that may move :latest.
  #
  # Two images are built per forwarder (standard and debug) and they finish
  # around the same time, so more than one setting publish_latest would race for
  # the same tag and the winner would be whichever runner happened to finish
  # last.
  #
  # Filebeat rather than the others because the Fluent Bit and Fluentd image
  # builds are retired (see the note at the top of publish_10x_forwarder.yaml);
  # those forwarders run edge-10x as a sidecar and neither image is referenced
  # anywhere in the docs.
  filebeat:
    if: ${{ inputs.publish_filebeat }}
    name: Filebeat
    uses: ./.github/workflows/publish_10x_forwarder.yaml
    needs:
      - prepare
    with:
      release_version: ${{ needs.prepare.outputs.release_version }}
      docker_hub: ${{ inputs.docker_hub }}
      forwarder_type: Filebeat
      tenx_dist: Runtime
      publish_latest: true
    secrets: inherit

  filebeat-debug:
    if: ${{ inputs.publish_filebeat_debug }}
    name: Filebeat Debug
    uses: ./.github/workflows/publish_10x_forwarder.yaml
    needs:
      - prepare
    with:
      release_version: ${{ needs.prepare.outputs.release_version }}
      docker_hub: ${{ inputs.docker_hub }}
      forwarder_type: Filebeat-Debug
      tenx_dist: Runtime
    secrets: inherit

  # No publish_latest on Fluent Bit or Fluentd, deliberately, not by oversight.
  # Both images are retired image-swap builds; the current model runs edge-10x as
  # a sidecar. A mutable convenience tag on a retired build path only advertises
  # a path we have moved off. Reasoning and the conditions for reversing it:
  # fwd/fluentd/DEPRECATED.md.
  fluent-bit:
    if: ${{ inputs.publish_fluent_bit }}
    name: Fluent-Bit
    uses: ./.github/workflows/publish_10x_forwarder.yaml
    needs:
      - prepare
    with:
      release_version: ${{ needs.prepare.outputs.release_version }}
      docker_hub: ${{ inputs.docker_hub }}
      forwarder_type: Fluent-Bit
      tenx_dist: Runtime
    secrets: inherit

  fluent-bit-debug:
    if: ${{ inputs.publish_fluent_bit_debug }}
    name: Fluent-Bit Debug
    uses: ./.github/workflows/publish_10x_forwarder.yaml
    needs:
      - prepare
    with:
      release_version: ${{ needs.prepare.outputs.release_version }}
      docker_hub: ${{ inputs.docker_hub }}
      forwarder_type: Fluent-Bit-Debug
      tenx_dist: Runtime
    secrets: inherit

  # See the note above fluent-bit: no publish_latest here either, deliberately.
  fluentd:
    if: ${{ inputs.publish_fluentd }}
    name: Fluentd
    uses: ./.github/workflows/publish_10x_forwarder.yaml
    needs:
      - prepare
    with:
      release_version: ${{ needs.prepare.outputs.release_version }}
      docker_hub: ${{ inputs.docker_hub }}
      forwarder_type: Fluentd
      tenx_dist: Runtime
    secrets: inherit
