name: Publish 10x forwarder container

# NOTE: the Fluent-Bit and Fluentd builds (fluent-bit-10x / fluentd-10x) are RETIRED.
# That was the image-swap model (10x baked into the forwarder image, in-process).
# Fluentd/Fluent Bit now run 10x as a separate log10x/edge-10x SIDECAR container on
# the upstream fluent charts (see https://doc.log10x.com/apps/receiver/deploy/).
# These build paths are kept for legacy rebuilds only -- do not use for new work.
# Filebeat stays live: it is the one genuinely embedded forwarder.

on:
  workflow_dispatch:
    inputs:
      release_version:
        required: true
        description: '10x version to install'
        type: string
      docker_hub:
        required: true
        description: 'Which docker hub to publish to'
        type: choice
        options:
          - All
          - GHCR
          - DockerHub
      forwarder_type:
        required: true
        description: 'Type of fwd container to build'
        type: choice
        options:
          - Filebeat
          - Filebeat-Debug
          - Fluent-Bit
          - Fluent-Bit-Debug
          - Fluentd
      tenx_dist:
        required: true
        type: choice
        description: Type of artifact
        options:
          - Runtime
      publish_latest:
        required: false
        default: false
        type: boolean
        description: 'Also move :latest to this build. Only one flavor may set it.'

  workflow_call:
    inputs:
      release_version:
        required: true
        type: string
      docker_hub:
        required: true
        type: string
      forwarder_type:
        required: true
        type: string
      tenx_dist:
        required: true
        type: string
      publish_latest:
        required: false
        default: false
        type: boolean
        description: |
          Move :latest to this build once it has been pulled back and run.

          No forwarder repo has ever had a :latest tag; filebeat-10x has 207
          tags and not one of them is latest, so the Receiver docs pin an exact
          version. Only ONE of the variants this workflow builds (the standard
          and debug images) may set this, or they race for the same tag. The
          orchestrator sets it on the standard Filebeat build only.

jobs:
  prepare:
    name: Checks parameters and sets vars
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.vars.outputs.image_name }}
      version_tag: ${{ steps.vars.outputs.version_tag }}
      docker_file: ${{ steps.vars.outputs.docker_file }}
      docker_context: ${{ steps.vars.outputs.docker_context }}
      docker_repo: ${{ steps.vars.outputs.docker_repo }}
      dockerhub_repo: ${{ steps.vars.outputs.dockerhub_repo }}
      docker_images: ${{ steps.vars.outputs.docker_images }}
    steps:
      - name: Check parameters
        uses: actions/github-script@v8
        with:
          script: |
            const validHubs = ["GHCR", "DockerHub", "All"];
            if (!validHubs.includes("${{ inputs.docker_hub }}")) {
              core.setFailed("docker_hub must be one of: GHCR, DockerHub, All")
            }

            const validTypes = ["Filebeat", "Filebeat-Debug", "Fluent-Bit", "Fluent-Bit-Debug", "Fluentd"];
            if (!validTypes.includes("${{ inputs.forwarder_type }}")) {
              core.setFailed("Only Filebeat/Filebeat-Debug/Fluent-Bit/Fluent-Bit-Debug/Fluentd forwarders are supported")
            }

            // "Native" is the old spelling of "Runtime" and still resolves, so
            // an in-flight workflow_dispatch does not fail on the rename.
            // "Edge" named the retired jpackage JIT build and is rejected
            // outright -- install.sh no longer accepts --flavor edge, so a build
            // that got this far would fail later and less clearly.
            const dist = "${{ inputs.tenx_dist }}";
            if (dist === "Edge") {
              core.setFailed("The Edge dist is retired. It built the jpackage JIT image (tag suffix -jit); install.sh no longer accepts --flavor edge. Use Runtime.")
            } else if (dist !== "Runtime" && dist !== "Native") {
              core.setFailed("Only the Runtime dist is supported (Native is accepted as its old name)")
            }

      - name: Prepare variables
        id: vars
        run: |
          IMAGE_NAME=""
          if [ "${{ inputs.forwarder_type }}" == "Filebeat" ]; then
            IMAGE_NAME="filebeat-10x"
            echo "docker_file=./main/fwd/filebeat/Dockerfile" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.forwarder_type }}" == "Filebeat-Debug" ]; then
            IMAGE_NAME="filebeat-10x"
            echo "docker_file=./main/fwd/filebeat/debug/Dockerfile" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.forwarder_type }}" == "Fluent-Bit" ]; then
            IMAGE_NAME="fluent-bit-10x"
            echo "docker_file=./main/fwd/fluent-bit/Dockerfile" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.forwarder_type }}" == "Fluent-Bit-Debug" ]; then
            IMAGE_NAME="fluent-bit-10x"
            echo "docker_file=./main/fwd/fluent-bit/debug/Dockerfile" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.forwarder_type }}" == "Fluentd" ]; then
            IMAGE_NAME="fluentd-10x"
            echo "docker_file=./main/fwd/fluentd/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "docker_context=." >> "$GITHUB_OUTPUT"
          echo "docker_repo=${{ vars.GHCR_REPO_NAME }}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_repo=docker.io/${{ vars.DOCKERHUB_REPO_NAME }}" >> "$GITHUB_OUTPUT"

          # The tag SUFFIX stays "-native". It is part of a published image
          # name, not a flag: 222 filebeat-10x tags carry it, the Receiver docs
          # pin exact tags, and charts/filebeat/values.yaml selects on it.
          # Renaming the flavor does not rename images already pulled.
          if [ "${{ inputs.forwarder_type }}" != "Fluent-Bit-Debug" ] && [ "${{ inputs.forwarder_type }}" != "Filebeat-Debug" ]; then
            echo "version_tag=${{inputs.release_version}}-native" >> "$GITHUB_OUTPUT"
          else
            echo "version_tag=${{inputs.release_version}}-native-debug" >> "$GITHUB_OUTPUT"
          fi

          IMAGES=""
          if [ "${{ inputs.docker_hub }}" == "GHCR" ] || [ "${{ inputs.docker_hub }}" == "All" ]; then
            IMAGES="${{ vars.GHCR_REPO_NAME }}/$IMAGE_NAME"
          fi
          if [ "${{ inputs.docker_hub }}" == "DockerHub" ] || [ "${{ inputs.docker_hub }}" == "All" ]; then
            if [ -n "$IMAGES" ]; then
              IMAGES=$(printf '%s\n%s' "$IMAGES" "docker.io/${{ vars.DOCKERHUB_REPO_NAME }}/$IMAGE_NAME")
            else
              IMAGES="docker.io/${{ vars.DOCKERHUB_REPO_NAME }}/$IMAGE_NAME"
            fi
          fi
          {
            echo 'docker_images<<EOF'
            echo "$IMAGES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  publish_x86:
    name: "Build x86 ${{inputs.forwarder_type}} ${{needs.prepare.outputs.version_tag}}"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: prepare

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          path: main

      - name: Login to GHCR
        if: ${{ inputs.docker_hub == 'GHCR' || inputs.docker_hub == 'All' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ inputs.docker_hub == 'DockerHub' || inputs.docker_hub == 'All' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{needs.prepare.outputs.docker_images}}
          tags: |
            type=raw,value=${{needs.prepare.outputs.version_tag}}-amd64
            type=raw,value=latest-amd64,enable=${{ inputs.publish_latest }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish container
        uses: docker/build-push-action@v7
        with:
          file: ${{needs.prepare.outputs.docker_file}}
          context: ${{needs.prepare.outputs.docker_context}}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            VERSION=${{inputs.release_version}}
            FLAVOR=runtime
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ steps.docker-meta.outputs.tags }}

  publish_aarch64:
    name: "Build aarch64 ${{inputs.forwarder_type}} ${{needs.prepare.outputs.version_tag}}"
    runs-on: linux-arm64-2core
    timeout-minutes: 12
    needs: prepare

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          path: main

      - name: Login to GHCR
        if: ${{ inputs.docker_hub == 'GHCR' || inputs.docker_hub == 'All' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ inputs.docker_hub == 'DockerHub' || inputs.docker_hub == 'All' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{needs.prepare.outputs.docker_images}}
          tags: |
            type=raw,value=${{needs.prepare.outputs.version_tag}}-aarch64
            type=raw,value=latest-aarch64,enable=${{ inputs.publish_latest }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish container
        uses: docker/build-push-action@v7
        with:
          file: ${{needs.prepare.outputs.docker_file}}
          context: ${{needs.prepare.outputs.docker_context}}
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            VERSION=${{inputs.release_version}}
            FLAVOR=runtime
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ steps.docker-meta.outputs.tags }}

  publish_manifest:
    name: Publish multiarch manifest for ${{needs.prepare.outputs.version_tag}}
    needs:
      - prepare
      - publish_x86
      - publish_aarch64
    uses: ./.github/workflows/update_multiarch_manifest.yaml
    with:
      version_tag: ${{needs.prepare.outputs.version_tag}}
      docker_hub: ${{ inputs.docker_hub }}
      docker_repo: ${{ needs.prepare.outputs.docker_repo }}
      image_name: ${{ needs.prepare.outputs.image_name }}
      dockerhub_repo: ${{ needs.prepare.outputs.dockerhub_repo }}
    secrets: inherit

  # LAUNCH the image before :latest points at it.
  #
  # This deliberately does NOT copy the `--version` check that gates edge-10x.
  # That check is not strong enough here, and this is measured rather than
  # supposed: log10x/filebeat-10x:1.1.25-native reports "10x engine v1.1.25"
  # from --version while being unable to launch its pipeline at all. Two
  # separate fatal defects hid behind a green --version, and both reached
  # customers:
  #
  #   docker-images#11  Could not create directory /var/log/tenx
  #   docker-images#12  Could not create directory .../${env:filebeatLogsPath}
  #
  # `--version` exits before the pipeline is constructed, which is exactly where
  # both failures live. So this runs the real entrypoint and asserts the engine
  # actually reached a constructed pipeline.
  #
  # ON THE LICENSE, WHICH IS THE SUBTLE PART
  #
  # The license baked into the image at build time is `limited`, and the Receiver
  # publishes metrics, which a limited license refuses:
  #
  #   metricOutput(Log10xMetricRegistryFactory) requires a license
  #
  # That refusal aborts the launch BEFORE the appenders are constructed, so a
  # gate running on the embedded license never reaches the defective code and
  # reports green on a broken image. Verified: an earlier version of this gate
  # passed on the known-broken image above. A gate that cannot fail on the
  # artifact it exists to reject is worse than no gate, because it is believed.
  #
  # So the gate fetches a demo license, which is a public unauthenticated
  # endpoint and needs no repository secret. Re-verified against both images,
  # broken and fixed, before being committed.
  smoke_launch:
    name: "Launch-gate ${{needs.prepare.outputs.version_tag}}"
    if: ${{ inputs.publish_latest }}
    needs:
      - prepare
      - publish_x86
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Launch the pushed image and require a constructed pipeline
        run: |
          set -euo pipefail
          IMAGE="${{needs.prepare.outputs.docker_repo}}/${{needs.prepare.outputs.image_name}}:${{needs.prepare.outputs.version_tag}}-amd64"
          echo "pulling $IMAGE"
          docker pull "$IMAGE"

          LIC=$(curl -sS -X POST https://api.log10x.com/api/v1/license/demo \
                  -H 'Content-Type: application/json' -d '{}' \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["license"])')
          if [ -z "$LIC" ]; then
            echo "::error::could not obtain a demo license; the gate cannot verify the launch"
            exit 1
          fi

          # Runs the image's real entrypoint (filebeat piped into the engine).
          # It is killed by timeout, so a non-zero exit here is expected.
          set +e
          OUT=$(timeout 90 docker run --rm -e TENX_LICENSE_KEY="$LIC" \
                  "$IMAGE" -e -strict.perms=false 2>&1 | head -400)
          set -e
          echo "$OUT" | head -40

          if echo "$OUT" | grep -q "could not launch pipeline"; then
            echo "::error::the pushed image cannot launch its pipeline. $(echo "$OUT" | grep -o 'Could not create directory [^ ]*' | head -1)"
            exit 1
          fi

          if ! echo "$OUT" | grep -q "pipeline units:"; then
            echo "::error::the engine never constructed a pipeline. The binary is gated upstream, so this is the image assembly: entrypoint, TENX_HOME layout, permissions, or a module config that cannot resolve."
            exit 1
          fi

          echo "launch OK: pipeline constructed, no launch failures"

  publish_latest_manifest:
    name: Publish multiarch manifest for latest
    if: ${{ inputs.publish_latest }}
    needs:
      - prepare
      - publish_x86
      - publish_aarch64
      - smoke_launch
    uses: ./.github/workflows/update_multiarch_manifest.yaml
    with:
      version_tag: latest
      docker_hub: ${{ inputs.docker_hub }}
      docker_repo: ${{ needs.prepare.outputs.docker_repo }}
      image_name: ${{ needs.prepare.outputs.image_name }}
      dockerhub_repo: ${{ needs.prepare.outputs.dockerhub_repo }}
    secrets: inherit
